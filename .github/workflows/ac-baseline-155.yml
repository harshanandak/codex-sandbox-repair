name: Baseline v0.155.0 sandbox tests

# Compares the two failing codex-windows-sandbox tests against the unmodified
# release commit on the same windows-2022 image, toolchain, test command, and
# environment as the repair workflow. Diagnostic only; it builds no artifact and
# installs nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "8388608"
      NEXTEST_PROFILE: local
      BASELINE_REF: baseline/v0.155.0
    steps:
      - name: Preserve source line endings
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: baseline/v0.155.0
          persist-credentials: false
      - name: Record baseline commit
        working-directory: ${{ github.workspace }}
        run: git rev-parse HEAD
      - name: Configure hosted Windows build paths
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'codex-baseline'
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          git config --global core.longpaths true
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: sandbox-baseline-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sandbox-baseline-
            sandbox-windows-
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Build sandbox helper binaries for tests
        run: |
          cargo build --bin codex-windows-sandbox-setup --bin codex-command-runner
          $debug = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $deps = Join-Path $debug 'deps'
          foreach ($bin in @('codex-windows-sandbox-setup.exe', 'codex-command-runner.exe')) {
            Copy-Item -LiteralPath (Join-Path $debug $bin) -Destination $deps -Force
          }
      - name: Baseline targeted tests
        env:
          CARGO_BIN_EXE_codex_windows_sandbox_setup: ${{ env.CARGO_TARGET_DIR }}\debug\codex-windows-sandbox-setup.exe
          CARGO_BIN_EXE_codex_command_runner: ${{ env.CARGO_TARGET_DIR }}\debug\codex-command-runner.exe
        run: |
          cargo nextest run -p codex-windows-sandbox --no-fail-fast -E "test(=unified_exec::tests::legacy_workspace_write_delete_is_limited_to_writable_roots) | test(=unified_exec::tests::legacy_capture_emits_output_and_preserves_descendant_after_normal_exit)"
