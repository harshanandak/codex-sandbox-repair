name: Windows sandbox payload repair

on:
  push:
    branches: [fix/windows-setup-payload]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Preserve source line endings
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Configure hosted Windows build paths
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'codex-build'
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          git config --global core.longpaths true
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: sandbox-windows-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            sandbox-windows-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
      - name: Format changed code
        run: |
          just fmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Scoped Clippy fixes
        run: just fix -p codex-windows-sandbox
      - name: Require committed formatting and lint fixes
        run: git diff --exit-code
      - name: Build sandbox helper binaries for tests
        run: |
          cargo build --locked --bin codex-windows-sandbox-setup --bin codex-command-runner
          $debug = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $deps = Join-Path $debug 'deps'
          foreach ($bin in @('codex-windows-sandbox-setup.exe', 'codex-command-runner.exe')) {
            Copy-Item -LiteralPath (Join-Path $debug $bin) -Destination $deps -Force
          }
      - name: Test sandbox crate
        env:
          CARGO_BIN_EXE_codex_windows_sandbox_setup: ${{ env.CARGO_TARGET_DIR }}\debug\codex-windows-sandbox-setup.exe
          CARGO_BIN_EXE_codex_command_runner: ${{ env.CARGO_TARGET_DIR }}\debug\codex-command-runner.exe
        run: just test -p codex-windows-sandbox
      - name: Build matching parent and helper binaries
        id: build-bins
        if: always()
        env:
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: >-
          cargo build --locked --timings
          --bin codex --bin codex-app-server --bin codex-code-mode-host
          --bin codex-responses-api-proxy --bin codex-windows-sandbox-setup
          --bin codex-command-runner
      - name: Stage binaries with hashes
        if: always() && steps.build-bins.outcome == 'success'
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE 'artifacts/codex-sandbox-repair'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $binaries = @('codex','codex-app-server','codex-code-mode-host','codex-responses-api-proxy','codex-windows-sandbox-setup','codex-command-runner')
          $manifest = foreach ($name in $binaries) {
            $file = Join-Path $env:CARGO_TARGET_DIR "debug/$name.exe"
            Copy-Item -LiteralPath $file -Destination $dest
            @{name="$name.exe";sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash}
          }
          @{commit=$env:GITHUB_SHA;target='x86_64-pc-windows-msvc';profile='dev';binaries=$manifest} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $dest 'manifest.json')
      - name: Upload verified build
        if: always() && steps.build-bins.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-sandbox-repair-windows
          path: artifacts/codex-sandbox-repair/*
          if-no-files-found: error
      - name: Capture formatter and Clippy changes
        if: always()
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE 'artifacts/diagnostics'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          git diff --output="$dest/codex-build-fixes.patch"
          foreach ($relative in @('cargo-timings/cargo-timing.html','nextest/local/junit.xml')) {
            $file = Join-Path $env:CARGO_TARGET_DIR $relative
            if (Test-Path -LiteralPath $file) { Copy-Item -LiteralPath $file -Destination $dest }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-sandbox-build-diagnostics
          path: artifacts/diagnostics/*
